<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civilization 6 Timeline Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Civilization 6 Timeline Viewer</h1>
            <p class="subtitle">Upload your game's timeline JSON file to visualize your journey through history</p>
        </header>

        <div class="upload-section">
            <label for="file-input" class="upload-label">
                <span class="upload-icon">📁</span>
                <span class="upload-text">Drop your timeline JSON file here or click to browse</span>
                <span class="upload-hint">Timeline files are located in: Documents/My Games/Sid Meier's Civilization VI/Saves/Timeline/</span>
            </label>
            <input type="file" id="file-input" accept=".json" />
        </div>

        <div id="game-info" class="game-info hidden">
            <h2>Game Overview</h2>
            <div class="players-grid" id="players-grid"></div>
        </div>

        <div id="controls" class="controls hidden">
            <div class="filter-group">
                <label for="player-filter">Filter by Player:</label>
                <select id="player-filter">
                    <option value="-1">All Players</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="era-filter">Filter by Era:</label>
                <select id="era-filter">
                    <option value="all">All Eras</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="moment-type-filter">Filter by Moment Type:</label>
                <select id="moment-type-filter">
                    <option value="all">All Types</option>
                </select>
            </div>
            <div class="stats">
                <span id="moment-count">0 moments</span>
                <span id="turn-count">0 turns</span>
            </div>
        </div>

        <div id="timeline" class="timeline hidden"></div>

        <footer>
            <p>Timeline files are generated by Civilization 6 at the end of each game.</p>
        </footer>
    </div>

    <button id="back-to-top" class="back-to-top" title="Back to top">↑</button>

    <script src="app.js"></script>
</body>
</html>
